{% extends "tanitim_duzen.html" %}
{% block baslik %}Şirket kaydı{% endblock %}
{% block form %}
  <h2>Şirketinizi kaydedin</h2>
  <form method="post">
    <label for="sirket">Şirket adı</label>
    <input id="sirket" name="sirket" required autofocus>
    <label for="kullanici_adi">Yönetici kullanıcı adı</label>
    <input id="kullanici_adi" name="kullanici_adi" autocomplete="username" required>
    <label for="parola">Parola</label>
    <input id="parola" type="password" name="parola" autocomplete="new-password" minlength="8" required>
    <span class="ipucu">En az 8 karakter. Parolanız düz metin olarak saklanmaz.</span>
    <button class="btn tam" type="submit">Kayıt ol</button>
  </form>
  <p class="alt">Zaten hesabınız var mı? <a href="{{ url_for('giris') }}">Giriş yap</a></p>
{% endblock %}
